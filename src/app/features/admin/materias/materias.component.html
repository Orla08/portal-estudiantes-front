<app-navbar />
<p-toast />
<app-confirm-dialog />
<div class="p-4 md:p-6 animate-in">
  <div class="page-header">
    <a class="page-header__back" routerLink="/inicio" aria-label="Volver al inicio">
      <i class="pi pi-arrow-left"></i>
    </a>
    <h2 class="page-header__title">Materias</h2>
    <div class="page-header__actions">
      <p-button label="Nueva Materia" icon="pi pi-plus" (onClick)="abrirDialog()" />
    </div>
  </div>

  @if (loading()) {
    <div class="flex justify-content-center p-6"><p-progressSpinner /></div>
  } @else {
    <p-table [value]="materias()" [tableStyle]="{'min-width': '50rem'}" stripedRows [paginator]="true" [rows]="10">
      <ng-template pTemplate="header">
        <tr>
          <th>Nombre</th><th>Profesor</th><th>Créditos</th><th>Estado</th><th>Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-m>
        <tr>
          <td>{{ m.nombre }}</td>
          <td>{{ m.nombreProfesor }}</td>
          <td>{{ m.creditos }}</td>
          <td><p-tag [value]="m.estado ? 'Activo' : 'Inactivo'" [severity]="m.estado | estadoBadge" /></td>
          <td>
            <p-button icon="pi pi-pencil" severity="warn" size="small" [text]="true"
                      (onClick)="abrirDialog(m)" aria-label="Editar materia" />
            <p-button icon="pi pi-trash" severity="danger" size="small" [text]="true"
                      (onClick)="confirmarEliminar(m)" aria-label="Eliminar materia" />
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr><td colspan="5" class="text-center p-5">No hay materias registradas</td></tr>
      </ng-template>
    </p-table>
  }
</div>

<p-dialog [header]="editando ? 'Editar Materia' : 'Nueva Materia'" [(visible)]="dialogVisible" [modal]="true" [style]="{width: '500px'}">
  <form [formGroup]="form" (ngSubmit)="guardar()" class="flex flex-column gap-3 pt-2">
    <div class="flex flex-column gap-1">
      <label class="font-semibold text-sm">Nombre</label>
      <input pInputText formControlName="nombre" class="w-full" />
    </div>
    <div class="flex flex-column gap-1">
      <label class="font-semibold text-sm">Créditos</label>
      <p-inputNumber formControlName="creditos" [min]="1" [max]="10" styleClass="w-full" />
    </div>
    <div class="flex flex-column gap-1">
      <label class="font-semibold text-sm">Profesor</label>
      <p-select formControlName="profesorId" [options]="profesores()" optionLabel="nombre"
                optionValue="profesorId" placeholder="Seleccione…" styleClass="w-full" />
    </div>
    <div class="flex flex-column gap-1">
      <label class="font-semibold text-sm">Programa de Crédito</label>
      <p-select formControlName="programaCreditoId" [options]="programas()" optionLabel="nombre"
                optionValue="programaCreditoId" placeholder="Seleccione…" styleClass="w-full" />
    </div>
    <div class="flex gap-2 justify-content-end pt-1">
      <p-button label="Cancelar" severity="secondary" type="button" (onClick)="dialogVisible = false" />
      <p-button [label]="editando ? 'Actualizar' : 'Crear'" type="submit" [loading]="guardando()" />
    </div>
  </form>
</p-dialog>
