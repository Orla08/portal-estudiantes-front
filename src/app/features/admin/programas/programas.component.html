<app-navbar />
<p-toast />
<div class="p-4 md:p-6 animate-in">
  <div class="page-header">
    <a class="page-header__back" routerLink="/inicio" aria-label="Volver al inicio">
      <i class="pi pi-arrow-left"></i>
    </a>
    <h2 class="page-header__title">Programas de Crédito</h2>
    <div class="page-header__actions">
      <p-button label="Nuevo Programa" icon="pi pi-plus" (onClick)="abrirDialog()" />
    </div>
  </div>

  @if (loading()) {
    <div class="flex justify-content-center p-6"><p-progressSpinner /></div>
  } @else {
    <p-table [value]="programas()" stripedRows [paginator]="true" [rows]="10">
      <ng-template pTemplate="header">
        <tr>
          <th>Nombre</th><th>Créditos por Materia</th><th>Máx. Materias</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-p>
        <tr>
          <td>{{ p.nombre }}</td>
          <td>{{ p.creditosPorMateria }}</td>
          <td>{{ p.maxMateriasPorEstudiante }}</td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr><td colspan="3" class="text-center p-5">No hay programas registrados</td></tr>
      </ng-template>
    </p-table>
  }
</div>

<p-dialog header="Nuevo Programa de Crédito" [(visible)]="dialogVisible" [modal]="true" [style]="{width: '450px'}">
  <form [formGroup]="form" (ngSubmit)="guardar()" class="flex flex-column gap-3 pt-2">
    <div class="flex flex-column gap-1">
      <label class="font-semibold text-sm">Nombre</label>
      <input pInputText formControlName="nombre" class="w-full" />
      @if (form.get('nombre')?.invalid && form.get('nombre')?.touched) {
        <small class="text-red-500">Requerido</small>
      }
    </div>
    <div class="flex flex-column gap-1">
      <label class="font-semibold text-sm">Créditos por Materia</label>
      <p-inputNumber formControlName="creditosPorMateria" [min]="1" styleClass="w-full" />
    </div>
    <div class="flex flex-column gap-1">
      <label class="font-semibold text-sm">Máximo de Materias por Estudiante</label>
      <p-inputNumber formControlName="maxMateriasPorEstudiante" [min]="1" [max]="10" styleClass="w-full" />
    </div>
    <div class="flex gap-2 justify-content-end pt-1">
      <p-button label="Cancelar" severity="secondary" type="button" (onClick)="dialogVisible = false" />
      <p-button label="Crear" type="submit" [loading]="guardando()" />
    </div>
  </form>
</p-dialog>
