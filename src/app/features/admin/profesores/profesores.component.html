<app-navbar />
<p-toast />
<app-confirm-dialog />
<div class="p-4 md:p-6 animate-in">
  <div class="page-header">
    <a class="page-header__back" routerLink="/inicio" aria-label="Volver al inicio">
      <i class="pi pi-arrow-left"></i>
    </a>
    <h2 class="page-header__title">Profesores</h2>
    <div class="page-header__actions">
      <p-button label="Nuevo Profesor" icon="pi pi-plus" (onClick)="abrirDialog()" />
    </div>
  </div>

  @if (loading()) {
    <div class="flex justify-content-center p-6"><p-progressSpinner /></div>
  } @else {
    <div class="table-responsive">
    <p-table [value]="profesores()" [tableStyle]="{'min-width': '20rem'}" stripedRows [paginator]="true" [rows]="10">
      <ng-template pTemplate="header">
        <tr>
          <th>ID</th><th>Nombre</th><th>Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-p>
        <tr>
          <td>{{ p.profesorId }}</td>
          <td>{{ p.nombre }}</td>
          <td>
            <p-button icon="pi pi-pencil" severity="warn" size="small" [text]="true"
                      (onClick)="abrirDialog(p)" aria-label="Editar profesor" />
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr><td colspan="3" class="text-center p-5">No hay profesores registrados</td></tr>
      </ng-template>
    </p-table>
    </div>
  }
</div>

<p-dialog [header]="editando ? 'Editar Profesor' : 'Nuevo Profesor'" [(visible)]="dialogVisible" [modal]="true"
          [style]="{width: 'min(400px, 95vw)'}">
  <form [formGroup]="form" (ngSubmit)="guardar()" class="flex flex-column gap-3 pt-2">
    <div class="flex flex-column gap-1">
      <label class="font-semibold text-sm">Nombre</label>
      <input pInputText formControlName="nombre" class="w-full" />
      @if (form.get('nombre')?.invalid && form.get('nombre')?.touched) {
        <small class="text-red-500">Requerido</small>
      }
    </div>
    <div class="flex gap-2 justify-content-end pt-1">
      <p-button label="Cancelar" severity="secondary" type="button" (onClick)="dialogVisible = false" />
      <p-button [label]="editando ? 'Actualizar' : 'Crear'" type="submit" [loading]="guardando()" />
    </div>
  </form>
</p-dialog>
