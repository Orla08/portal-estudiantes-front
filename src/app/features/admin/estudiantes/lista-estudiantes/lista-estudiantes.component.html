<app-navbar />
<p-toast />
<app-confirm-dialog />
<div class="p-4 md:p-6 animate-in">
  <div class="page-header">
    <a class="page-header__back" routerLink="/inicio" aria-label="Volver al inicio">
      <i class="pi pi-arrow-left"></i>
    </a>
    <h2 class="page-header__title">Estudiantes</h2>
    <div class="page-header__actions">
      <p-button label="Nuevo Estudiante" icon="pi pi-plus" routerLink="/admin/estudiantes/nuevo" />
    </div>
  </div>

  @if (loading()) {
    <div class="flex justify-content-center p-6"><p-progressSpinner /></div>
  } @else {
    <div class="table-responsive">
    <p-table [value]="estudiantes()" [tableStyle]="{'min-width': '44rem'}" stripedRows [paginator]="true" [rows]="10">
      <ng-template pTemplate="header">
        <tr>
          <th>ID</th><th>Nombre</th><th>Email</th><th>Programa</th><th>Estado</th><th>Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-e>
        <tr>
          <td>{{ e.estudianteId }}</td>
          <td>{{ e.nombre }}</td>
          <td>{{ e.email }}</td>
          <td>{{ e.nombrePrograma }}</td>
          <td><p-tag [value]="e.estado ? 'Activo' : 'Inactivo'" [severity]="e.estado | estadoBadge" /></td>
          <td>
            <p-button icon="pi pi-pencil" severity="warn" size="small" [text]="true"
                      [routerLink]="['/admin/estudiantes', e.estudianteId, 'editar']"
                      aria-label="Editar estudiante" />
            <p-button icon="pi pi-trash" severity="danger" size="small" [text]="true"
                      (onClick)="confirmarEliminar(e)" aria-label="Eliminar estudiante" />
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr><td colspan="6" class="text-center p-5">No hay estudiantes registrados</td></tr>
      </ng-template>
    </p-table>
    </div>
  }
</div>
