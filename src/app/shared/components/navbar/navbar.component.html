<p-menubar [model]="menuItems">
  <ng-template pTemplate="start">
    <span class="font-bold text-xl text-primary">Portal Estudiantes</span>
  </ng-template>
  <ng-template pTemplate="end">
    <div class="flex align-items-center gap-2">
      <span class="text-sm text-capitalize hidden md:inline">{{ authService.nombreUsuario() }}</span>
      <p-button label="Salir" icon="pi pi-sign-out" severity="secondary" size="small" (onClick)="logout()"
                styleClass="hidden md:inline-flex" />
      <p-button icon="pi pi-sign-out" severity="secondary" size="small" (onClick)="logout()"
                styleClass="md:hidden" [rounded]="true" [text]="true"
                aria-label="Salir" />
    </div>
  </ng-template>
</p-menubar>
